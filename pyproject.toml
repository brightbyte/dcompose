[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcompose"
version = "0.1.0"
description = "Wrapper around docker compose with modified behavior and extra subcommands"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dcompose = "dcompose.cli:main"
ddocker = "dcompose.docker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["E501"]
